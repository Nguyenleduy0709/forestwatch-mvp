services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: forestwatch-web:latest
    container_name: forestwatch-web
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=*
      - INFERENCE_MODE=fosp
      - FOSP_MODEL_PATH=/app/best.pth
      - FOSP_RUNTIME_DIR=/opt/fosp-runtime
      - DATABASE_PATH=/app/backend/db/db.sqlite3
      - MEDIA_ROOT=/app/backend/media
      - CACHE_DIR=/app/work/cache
      - TIME_ZONE=Asia/Ho_Chi_Minh
      - LOGIN_REDIRECT_URL=dashboard
    volumes:
      - ./backend/db:/app/backend/db
      - ./backend/media:/app/backend/media
      - ./backend/weights:/app/backend/weights:ro
    restart: unless-stopped
